name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Determine required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.classify.outputs.native }}
      lint: ${{ steps.classify.outputs.lint }}
      docs: ${{ steps.classify.outputs.docs }}
      wheel: ${{ steps.classify.outputs.wheel }}
      pyodide: ${{ steps.classify.outputs.pyodide }}
      unknown: ${{ steps.classify.outputs.unknown }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: 変更ファイルを収集
        id: changed-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -u
          changed_file_path="$RUNNER_TEMP/wandas-changed-files"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --name-only "$BASE_SHA" "$CURRENT_SHA" > "$changed_file_path"; then
              printf '%s\n' '__ci_route_unknown__' > "$changed_file_path"
            fi
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > "$changed_file_path"; then
              printf '%s\n' '__ci_route_unknown__' > "$changed_file_path"
            fi
          elif ! git ls-tree -r --name-only "$CURRENT_SHA" > "$changed_file_path"; then
            printf '%s\n' '__ci_route_unknown__' > "$changed_file_path"
          fi
          printf 'path=%s\n' "$changed_file_path" >> "$GITHUB_OUTPUT"

      - name: 変更パスを保守的に分類
        id: classify
        run: uv run --no-project --python 3.12 python scripts/ci_route.py --github-output "$GITHUB_OUTPUT" < "${{ steps['changed-files'].outputs.path }}"

  lint:
    name: Lint and Type Check
    if: needs.route.outputs.lint == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: 依存関係をインストール (testグループ + 非ML extras)
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group test

      - name: フォーマットチェック (ruff format)
        run: uv run --no-sync ruff format --check wandas tests scripts learning-path

      - name: Lintチェック (ruff check)
        run: uv run --no-sync ruff check wandas tests scripts learning-path

      - name: 型チェック (ty)
        run: uv run --no-sync ty check wandas tests scripts learning-path

  docs:
    name: Build Documentation
    if: needs.route.outputs.docs == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: 依存関係をインストール (docsグループ + 非ML extras)
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group docs --group test

      - name: 公開exportとdocstringの軽量チェック
        run: uv run --no-sync python scripts/check_public_docstrings.py

      - name: Learning applicationsのsource check
        run: uv run --no-sync marimo check --strict learning-path/*.py

      - name: Learning Path翻訳カタログの検証
        run: uv run --no-sync python scripts/validate_learning_path_i18n.py

      - name: Learning Path全体のexport planを検証
        run: uv run --no-sync python scripts/export_learning_path.py --all --dry-run

      - name: Learning Path翻訳済み教材を日英export
        env:
          MPLBACKEND: Agg
        run: >-
          uv run --no-sync python scripts/export_learning_path.py
          --translated --output "$RUNNER_TEMP/wandas-learning-path-translated" --jobs 2

      - name: Learning Path翻訳済み教材の生成HTMLを検証
        run: >-
          uv run --no-sync python scripts/validate_learning_path_i18n.py
          --site "$RUNNER_TEMP/wandas-learning-path-translated" --translated

      - name: Documentation contract tests
        run: uv run --no-sync pytest tests/docs -q --no-cov

      - name: ドキュメントのビルドテスト (MkDocs)
        run: uv run --no-sync mkdocs build --strict -f docs/mkdocs.yml

  core-install-smoke:
    name: Core-only wheel install smoke
    if: needs.route.outputs.wheel == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: wheel をビルド
        run: uv build --wheel

      - name: core-only wheel install smoke
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wandas-core-smoke"
          uv pip install --python "$RUNNER_TEMP/wandas-core-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wandas-core-smoke/bin/python" - <<'PY'
          import importlib
          import importlib.util
          import pkgutil
          import tempfile
          from pathlib import Path

          import numpy as np
          import wandas as wd

          optional_modules = [
              "h5py",
              "h5netcdf",
              "IPython",
              "librosa",
              "mosqito",
              "tensorflow",
              "torch",
          ]
          installed_optional = [name for name in optional_modules if importlib.util.find_spec(name) is not None]
          assert installed_optional == [], f"Unexpected optional packages installed: {installed_optional}"

          import_errors = []
          for module_info in pkgutil.walk_packages(wd.__path__, prefix=f"{wd.__name__}."):
              try:
                  importlib.import_module(module_info.name)
              except Exception as exc:  # noqa: BLE001 - CI smoke should report every import failure.
                  import_errors.append(f"{module_info.name}: {type(exc).__name__}: {exc}")
          assert import_errors == [], "Submodule imports failed:\n" + "\n".join(import_errors)

          data = np.sin(np.linspace(0, 16, 4096, dtype=float))[None, :]
          frame = wd.ChannelFrame.from_numpy(data, sampling_rate=48000)
          assert np.allclose((frame + 1).to_numpy(), data + 1)
          assert frame.to_dataframe().shape == (4096, 1)
          assert frame.fft().n_channels == 1

          with tempfile.TemporaryDirectory() as tmpdir:
              output = Path(tmpdir) / "describe.png"
              frame.describe(image_save=output)
              assert output.exists(), "describe(image_save=...) should work in a core-only install"
          PY

  pyodide:
    name: Pyodide 314.0.3
    if: needs.route.outputs.pyodide == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm と Pyodide 配布物をキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/wandas/pyodide/314.0.3
          key: ${{ runner.os }}-node22-pyodide-314.0.3-${{ hashFiles('scripts/pyodide/package.json', 'scripts/pyodide/package-lock.json', 'scripts/pyodide/requirements.txt') }}

      - name: Pyodide core tests と WAV smoke を実行
        run: bash scripts/test_pyodide.sh

  native-test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: needs.route.outputs.native == 'true'
    needs: route
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            coverage: false
            numpy-version: "1.26.4"
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true
          - os: windows-latest
            python-version: "3.14"
            coverage: false
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: uv をインストール
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: 依存関係をインストール
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group test

      - name: NumPy下限をインストール
        if: matrix.numpy-version != ''
        run: |
          uv pip install "numpy==${{ matrix.numpy-version }}"
          uv pip check

      - name: テスト実行 (pytest、カバレッジなし)
        if: matrix.coverage != true
        env:
          MPLBACKEND: ${{ matrix.os == 'windows-latest' && 'Agg' || '' }}
        run: uv run --no-sync pytest -n auto -vv --no-cov

      - name: テスト実行 (pytest、カバレッジあり)
        if: matrix.coverage == true
        env:
          MPLBACKEND: ${{ matrix.os == 'windows-latest' && 'Agg' || '' }}
        run: uv run --no-sync pytest -n auto -vv

      - name: Upload coverage reports to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: kasahart/wandas

  ci-gate:
    name: CI Gate
    if: always()
    needs: [route, lint, docs, core-install-smoke, pyodide, native-test]
    runs-on: ubuntu-latest
    steps:
      - name: 選択されたチェックの結果を検証
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          NATIVE_REQUIRED: ${{ needs.route.outputs.native }}
          NATIVE_RESULT: ${{ needs['native-test'].result }}
          LINT_REQUIRED: ${{ needs.route.outputs.lint }}
          LINT_RESULT: ${{ needs.lint.result }}
          DOCS_REQUIRED: ${{ needs.route.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WHEEL_REQUIRED: ${{ needs.route.outputs.wheel }}
          WHEEL_RESULT: ${{ needs['core-install-smoke'].result }}
          PYODIDE_REQUIRED: ${{ needs.route.outputs.pyodide }}
          PYODIDE_RESULT: ${{ needs.pyodide.result }}
        shell: bash
        run: |
          set -u

          required_outputs=(NATIVE_REQUIRED LINT_REQUIRED DOCS_REQUIRED WHEEL_REQUIRED PYODIDE_REQUIRED)
          invalid_outputs=()
          for output_name in "${required_outputs[@]}"; do
            output_value="${!output_name-}"
            case "$output_value" in
              true|false) ;;
              *) invalid_outputs+=("$output_name=${output_value:-<empty>}") ;;
            esac
          done

          if (( ${#invalid_outputs[@]} > 0 )); then
            echo "Invalid CI routing outputs: ${invalid_outputs[*]}" >&2
            exit 1
          fi

          if [[ "$ROUTE_RESULT" != "success" ]]; then
            echo "The CI routing job did not succeed: $ROUTE_RESULT" >&2
            exit 1
          fi

          failed_checks=()
          if [[ "$NATIVE_REQUIRED" == "true" && "$NATIVE_RESULT" != "success" ]]; then
            failed_checks+=(native-test:$NATIVE_RESULT)
          fi
          if [[ "$LINT_REQUIRED" == "true" && "$LINT_RESULT" != "success" ]]; then
            failed_checks+=(lint:$LINT_RESULT)
          fi
          if [[ "$DOCS_REQUIRED" == "true" && "$DOCS_RESULT" != "success" ]]; then
            failed_checks+=(docs:$DOCS_RESULT)
          fi
          if [[ "$WHEEL_REQUIRED" == "true" && "$WHEEL_RESULT" != "success" ]]; then
            failed_checks+=(core-install-smoke:$WHEEL_RESULT)
          fi
          if [[ "$PYODIDE_REQUIRED" == "true" && "$PYODIDE_RESULT" != "success" ]]; then
            failed_checks+=(pyodide:$PYODIDE_RESULT)
          fi

          if (( ${#failed_checks[@]} > 0 )); then
            echo "Selected CI checks did not succeed: ${failed_checks[*]}" >&2
            exit 1
          fi

          echo "All selected CI checks succeeded; intentionally skipped checks are accepted."
