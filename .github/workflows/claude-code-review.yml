name: Claude Code Review

# Automatic Claude Code review when a PR is opened (or leaves draft).
# For a re-review after new commits, comment "@claude review" (see claude.yml).
# Auth and App setup: see the header of claude.yml.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check credentials
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH$API_KEY" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY is not set; skipping Claude review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 1

      # Lets the reviewer run scripts and tests to confirm what it reports.
      - uses: astral-sh/setup-uv@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.auth.outputs.ok == 'true'
        run: |
          uv python install 3.12
          uv sync --no-dev --extra io --extra effects --extra psychoacoustic --group test

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ok == 'true'
        env:
          # The reviewer runs PR code; keep credentials out of its subprocesses.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following .claude/review.md.
            The PR branch is checked out in the current working directory and
            its dependencies are installed (`uv run --no-sync ...`).
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(uv run --no-sync python:*),Bash(uv run --no-sync pytest:*),Read,Write,Grep,Glob"
