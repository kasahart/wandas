name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main  # mainブランチへのプッシュ時にトリガー

permissions:
  contents: write # peaceiris/actions-gh-pages が gh-pages ブランチにプッシュするために必要

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          # pyproject.toml に基づくバージョン、または特定のバージョンを指定
          python-version: '3.10'
          enable-cache: true # 依存関係のキャッシュを有効化

      - name: Install dependencies including MkDocs
        # Keep deployment aligned with the lightweight documentation dependency surface.
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group docs

      - name: Validate public exports and docstrings
        run: uv run --no-sync python scripts/check_public_docstrings.py

      - name: Validate learning applications
        run: uv run --no-sync marimo check --strict learning-path/*.py

      - name: Validate Learning Path translations
        run: uv run --no-sync python scripts/validate_learning_path_i18n.py

      - name: Build MkDocs documentation
        # uv run を使って uv の環境で mkdocs を実行
        run: uv run --no-sync mkdocs build --strict -f docs/mkdocs.yml

      - name: Export learning applications
        env:
          MPLBACKEND: Agg
        run: uv run --no-sync python scripts/export_learning_path.py --all --output docs/site --jobs 1

      - name: Validate exported Learning Path HTML
        run: uv run --no-sync python scripts/validate_learning_path_i18n.py --site docs/site --all

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/site # MkDocs のビルド出力ディレクトリ
          # publish_branch: gh-pages # デプロイ先のブランチ (デフォルト)
          # user_name: 'github-actions[bot]' # コミットユーザー名 (デフォルト)
          # user_email: 'github-actions[bot]@users.noreply.github.com' # コミットユーザーEmail (デフォルト)
