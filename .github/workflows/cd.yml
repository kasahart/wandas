name: Deploy on Tag

# Tag pushes drive package and GitHub Release publication through this workflow.

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    full-compatibility:
        name: Full compatibility validation
        uses: ./.github/workflows/full-compatibility.yml
        with:
            ref: ${{ github.sha }}
        secrets: inherit

    build:
        name: Build distribution
        needs: full-compatibility
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: リポジトリをチェックアウト
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: uv をインストール
              uses: astral-sh/setup-uv@v5
              with:
                  version: "latest"
                  # キャッシュを有効にする
                  enable-cache: true

            - name: Python をセットアップ
              run: uv python install

            - name: Build a binary wheel and a source tarball
              # Source validation is owned by Full Compatibility; this job
              # only creates the artifacts that the release jobs publish.
              run: uv build

            - name: Store the distribution packages
              uses: actions/upload-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

    test-installation:
        name: Test installation from wheel
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: リポジトリをチェックアウト
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: uv をインストール
              uses: astral-sh/setup-uv@v5
              with:
                  version: "latest"
                  # キャッシュを有効にする
                  enable-cache: true

            - name: Python をセットアップ
              run: uv python install

            - name: Download wheel artifact
              uses: actions/download-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Create virtual environment
              run: uv venv test-install-env

            - name: Activate virtual environment and install wheel
              run: |
                  source test-install-env/bin/activate
                  uv pip install dist/*.whl

            - name: Run import test
              run: |
                  source test-install-env/bin/activate
                  uv run python scripts/test_installation.py


    publish-to-pypi:
        name: >-
            Publish Python distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
        needs:
        - test-installation
        - full-compatibility
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/project/wandas/  # Replace <package-name> with your PyPI project name
        permissions:
            id-token: write  # IMPORTANT: mandatory for trusted publishing

        steps:
        - name: Download all the dists
          uses: actions/download-artifact@v4
          with:
            name: python-package-distributions
            path: dist/
        - name: Publish distribution to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
          with:
            password: ${{secrets.PYPI_API_TOKEN}}

    verify-pypi-pyodide:
        name: Verify published package in Pyodide
        needs: publish-to-pypi
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: リポジトリをチェックアウト
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Node.js 22 をセットアップ
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: npm と Pyodide 配布物をキャッシュ
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      ~/.cache/wandas/pyodide/314.0.3
                  key: ${{ runner.os }}-node22-pyodide-314.0.3-${{ hashFiles('scripts/pyodide/package.json', 'scripts/pyodide/package-lock.json', 'scripts/pyodide/requirements.txt') }}

            - name: PyPI の公開物を Pyodide で検証
              run: bash scripts/test_pyodide.sh published "${GITHUB_REF_NAME#v}"


    github-release:
        name: >-
            Sign the Python distribution with Sigstore
            and upload them to GitHub Release
        needs:
        - publish-to-pypi
        - verify-pypi-pyodide
        runs-on: ubuntu-latest

        permissions:
            contents: write  # IMPORTANT: mandatory for making GitHub Releases
            id-token: write  # IMPORTANT: mandatory for sigstore

        steps:
            - name: Download all the dists
              uses: actions/download-artifact@v4
              with:
                name: python-package-distributions
                path: dist/
            - name: Sign the dists with Sigstore
              uses: sigstore/gh-action-sigstore-python@v3.0.0
              with:
                inputs: >-
                    ./dist/*.tar.gz
                    ./dist/*.whl
            - name: Create GitHub Release and Upload Assets
              uses: softprops/action-gh-release@v2
              with:
                # GITHUB_TOKEN はデフォルトで使用されるが、明示的に指定
                # token: ${{ secrets.GITHUB_TOKEN }}
                tag_name: ${{ github.ref_name }} # トリガーとなったタグ名を使用
                generate_release_notes: true # リリースノートを自動生成
                files: dist/* # distディレクトリ内の全ファイル (署名含む) をアップロード
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # パーミッションで与えられたトークンを使用
