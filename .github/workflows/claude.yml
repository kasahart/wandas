name: Claude

# Comment "@claude ..." on a PR, a PR review, a review comment, or an issue
# and Claude Code answers there (review, question, or a requested change).
# Only users with write access to this repository can trigger it.
#
# Auth: register ONE of these repository secrets
#   CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max; generate with `claude setup-token`)
#   ANTHROPIC_API_KEY        (Anthropic Console API key, billed per use)
# and install the Claude GitHub App (https://github.com/apps/claude) on this repo.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Check credentials
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
        run: |
          # Checked here, before installing dependencies, because the action
          # itself only rejects non-writers once it starts.
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          if [ -z "$OAUTH$API_KEY" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY is not set; skipping Claude."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$PERMISSION" != admin ] && [ "$PERMISSION" != maintain ] && [ "$PERMISSION" != write ]; then
            echo "::notice::$ACTOR has '$PERMISSION' permission; skipping Claude."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          # The action puts a write token in .git/config and GH_TOKEN, which the
          # scrub does not hide, so a fork's code and gh must not run here.
          HEAD_REPO=${{ github.repository }}
          if [ -n "$PR_NUMBER" ]; then
            HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.repo.full_name 2>/dev/null || echo unknown)
          fi
          if [ "$HEAD_REPO" = "${{ github.repository }}" ]; then
            echo "run_code=true" >> "$GITHUB_OUTPUT"
            echo 'run_tools=,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(uv run --no-sync python:*),Bash(uv run --no-sync pytest:*)' >> "$GITHUB_OUTPUT"
          else
            echo "run_code=false" >> "$GITHUB_OUTPUT"
            echo "run_note= Code execution is off because this pull request comes from a fork or its head repository could not be checked; review by reading it." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 1

      # Lets the reviewer run scripts and tests to confirm what it reports.
      - uses: astral-sh/setup-uv@v5
        if: steps.auth.outputs.ok == 'true' && steps.auth.outputs.run_code == 'true'
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.auth.outputs.ok == 'true' && steps.auth.outputs.run_code == 'true'
        run: |
          uv python install 3.12
          uv sync --no-dev --extra io --extra effects --extra psychoacoustic --group test

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB isolates the reviewer's subprocesses
      # with bubblewrap, which needs the user namespaces Ubuntu 24.04 blocks.
      # sudo and Docker would let PR code escape that isolation, so both go.
      - name: Isolate the reviewer's subprocesses
        if: steps.auth.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo systemctl stop docker.socket docker.service
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available after removing /etc/sudoers.d/runner."
            exit 1
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc true

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ok == 'true'
        env:
          # The reviewer runs PR code; keep credentials out of its subprocesses.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write${{ steps.auth.outputs.run_tools }}"
            --append-system-prompt "Reply in Japanese. Follow AGENTS.md and CLAUDE.md in this repository. When asked to review a pull request, follow .claude/review.md, but put the summary in your progress comment instead of a separate gh pr comment.${{ steps.auth.outputs.run_note }}"
