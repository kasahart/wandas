name: Claude

# Comment "@claude ..." on a PR, a PR review, a review comment, or an issue
# and Claude Code answers there (review, question, or a requested change).
# Only users with write access to this repository can trigger it.
#
# Auth: register ONE of these repository secrets
#   CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max; generate with `claude setup-token`)
#   ANTHROPIC_API_KEY        (Anthropic Console API key, billed per use)
# and install the Claude GitHub App (https://github.com/apps/claude) on this repo.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Check credentials
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH$API_KEY" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY is not set; skipping Claude."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --append-system-prompt "Reply in Japanese. Follow AGENTS.md and CLAUDE.md in this repository."
