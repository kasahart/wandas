name: Full Compatibility

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to validate; leave blank for the selected workflow ref"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA to validate"
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: 依存関係をインストール (testグループ + 非ML extras)
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group test

      - name: フォーマットチェック (ruff format)
        run: uv run --no-sync ruff format --check wandas tests scripts learning-path

      - name: Lintチェック (ruff check)
        run: uv run --no-sync ruff check wandas tests scripts learning-path

      - name: 型チェック (ty)
        run: uv run --no-sync ty check wandas tests scripts learning-path

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: 依存関係をインストール (docsグループ + 非ML extras)
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group docs

      - name: 公開exportとdocstringの軽量チェック
        run: uv run --no-sync python scripts/check_public_docstrings.py

      - name: Learning applicationsのsource check
        run: uv run --no-sync marimo check --strict learning-path/*.py

      - name: ドキュメントのビルドテスト (MkDocs)
        run: uv run --no-sync mkdocs build --strict -f docs/mkdocs.yml

  core-install-smoke:
    name: Core-only wheel install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 3.12 をインストール
        run: uv python install 3.12

      - name: wheel をビルド
        run: uv build --wheel

      - name: core-only wheel install smoke
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wandas-core-smoke"
          uv pip install --python "$RUNNER_TEMP/wandas-core-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wandas-core-smoke/bin/python" - <<'PY'
          import importlib
          import importlib.util
          import pkgutil
          import tempfile
          from pathlib import Path

          import numpy as np
          import wandas as wd

          optional_modules = [
              "h5py",
              "h5netcdf",
              "IPython",
              "librosa",
              "mosqito",
              "tensorflow",
              "torch",
          ]
          installed_optional = [name for name in optional_modules if importlib.util.find_spec(name) is not None]
          assert installed_optional == [], f"Unexpected optional packages installed: {installed_optional}"

          import_errors = []
          for module_info in pkgutil.walk_packages(wd.__path__, prefix=f"{wd.__name__}."):
              try:
                  importlib.import_module(module_info.name)
              except Exception as exc:  # noqa: BLE001 - CI smoke should report every import failure.
                  import_errors.append(f"{module_info.name}: {type(exc).__name__}: {exc}")
          assert import_errors == [], "Submodule imports failed:\n" + "\n".join(import_errors)

          data = np.sin(np.linspace(0, 16, 4096, dtype=float))[None, :]
          frame = wd.ChannelFrame.from_numpy(data, sampling_rate=48000)
          assert np.allclose((frame + 1).to_numpy(), data + 1)
          assert frame.to_dataframe().shape == (4096, 1)
          assert frame.fft().n_channels == 1

          with tempfile.TemporaryDirectory() as tmpdir:
              output = Path(tmpdir) / "describe.png"
              frame.describe(image_save=output)
              assert output.exists(), "describe(image_save=...) should work in a core-only install"
          PY

  pyodide:
    name: Pyodide 314.0.3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm と Pyodide 配布物をキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/wandas/pyodide/314.0.3
          key: ${{ runner.os }}-node22-pyodide-314.0.3-${{ hashFiles('scripts/pyodide/package.json', 'scripts/pyodide/package-lock.json', 'scripts/pyodide/requirements.txt') }}

      - name: Pyodide core tests と WAV smoke を実行
        run: bash scripts/test_pyodide.sh

  native-test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true
          - os: windows-latest
            python-version: "3.10"
            coverage: false
          - os: windows-latest
            python-version: "3.11"
            coverage: false
          - os: windows-latest
            python-version: "3.12"
            coverage: false
          - os: windows-latest
            python-version: "3.13"
            coverage: false
          - os: windows-latest
            python-version: "3.14"
            coverage: false
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: uv をインストール
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: 依存関係をインストール
        run: uv sync --no-dev --extra io --extra effects --extra marimo --extra psychoacoustic --group test

      - name: テスト実行 (pytest、カバレッジなし)
        if: matrix.coverage != true
        env:
          MPLBACKEND: ${{ matrix.os == 'windows-latest' && 'Agg' || '' }}
        run: uv run --no-sync pytest -n auto -vv --no-cov

      - name: テスト実行 (pytest、カバレッジあり)
        if: matrix.coverage == true
        run: uv run --no-sync pytest -n auto -vv

      - name: Upload coverage reports to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: kasahart/wandas

  full-gate:
    name: Full Compatibility Gate
    if: always()
    needs: [lint, docs, core-install-smoke, pyodide, native-test]
    runs-on: ubuntu-latest
    steps:
      - name: 完全互換性チェックの結果を検証
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WHEEL_RESULT: ${{ needs['core-install-smoke'].result }}
          PYODIDE_RESULT: ${{ needs.pyodide.result }}
          NATIVE_RESULT: ${{ needs['native-test'].result }}
        shell: bash
        run: |
          set -u
          failed_checks=()
          for check in \
            "lint:$LINT_RESULT" \
            "docs:$DOCS_RESULT" \
            "core-install-smoke:$WHEEL_RESULT" \
            "pyodide:$PYODIDE_RESULT" \
            "native-test:$NATIVE_RESULT"; do
            if [[ "${check#*:}" != "success" ]]; then
              failed_checks+=("$check")
            fi
          done

          if (( ${#failed_checks[@]} > 0 )); then
            echo "Full compatibility checks did not succeed: ${failed_checks[*]}" >&2
            exit 1
          fi

          echo "All full compatibility checks succeeded."
